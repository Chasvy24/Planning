<body>
<style>
/* Layout : coquille d'application — barre supérieure collante, une colonne (max 1100px), onglets en bas sur téléphone, rail latéral dès 900px */
/* Palette : marrons (encre, boutons), bleu glacé (aujourd'hui, fériés, sélection), zèbre (jours de congé) */
:root {
  --bg: #F5F3F0;
  --surface: #FFFFFF;
  --sunk: #EDE8E3;
  --line: #DED6CE;
  --ink: #2B211C;
  --ink-2: #5E4F45;
  --ink-3: #8A7B70;
  --accent: #6B4A36;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAF1;
  --sun: #4C7D96;
  --sun-soft: #E2EFF5;
  --danger: #A2412F;
  --danger-soft: #F4E1DB;
  --ok: #5B6B3A;
  --ok-soft: #E7EADB;
  --off: #D6CDC4;
  --off-ink: #4A3D35;
  --scrim: rgba(43, 33, 28, .45);
  --shadow-c: rgba(43, 33, 28, .12);
  --c-perso: #A8703F;
  --c-travail: #3F6E8C;
  --c-admin: #57514C;
  --c-appart: #6F7A4F;
  --c-vac: #8B4A2B;
  --c-autre: #93877C;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15110E; --surface: #1F1915; --sunk: #2A221D; --line: #3A3029;
    --ink: #EFE8E2; --ink-2: #C4B5A9; --ink-3: #978879;
    --accent: #D4B79D; --accent-ink: #1F1915; --accent-soft: #233540;
    --sun: #A6CFE2; --sun-soft: #1F2F38;
    --danger: #E58A78; --danger-soft: #3A211B;
    --ok: #AEBB82; --ok-soft: #262B1C;
    --off: #40362F; --off-ink: #DCCFC3;
    --scrim: rgba(0, 0, 0, .6); --shadow-c: rgba(0, 0, 0, .4);
    --c-perso: #D6A070; --c-travail: #8FBCD8; --c-admin: #B9B1AA; --c-appart: #B4BC86; --c-vac: #D58E6C; --c-autre: #B3A89D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15110E; --surface: #1F1915; --sunk: #2A221D; --line: #3A3029;
  --ink: #EFE8E2; --ink-2: #C4B5A9; --ink-3: #978879;
  --accent: #D4B79D; --accent-ink: #1F1915; --accent-soft: #233540;
  --sun: #A6CFE2; --sun-soft: #1F2F38;
  --danger: #E58A78; --danger-soft: #3A211B;
  --ok: #AEBB82; --ok-soft: #262B1C;
  --off: #40362F; --off-ink: #DCCFC3;
  --scrim: rgba(0, 0, 0, .6); --shadow-c: rgba(0, 0, 0, .4);
  --c-perso: #D6A070; --c-travail: #8FBCD8; --c-admin: #B9B1AA; --c-appart: #B4BC86; --c-vac: #D58E6C; --c-autre: #B3A89D;
  color-scheme: dark;
}

* , *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-sm { width: 16px; height: 16px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.txt-danger { color: var(--danger); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- coquille ---------- */
.app {
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rail { display: none; }
.main { max-width: 1100px; margin: 0 auto; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 96px); min-width: 0; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; min-height: 60px;
  background: var(--bg);
}
.topbar h1 { font-size: 22px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-sm { font-family: var(--font-display); font-weight: 650; color: var(--accent); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; display: block; line-height: 1; margin-bottom: 2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2);
  display: inline-grid; place-items: center; flex: none;
}
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.back-btn { margin-left: -10px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
}
.tab {
  flex: 1; min-width: 0; height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); text-decoration: none; font-size: 12px; font-weight: 600; position: relative;
}
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

.fab {
  position: fixed; z-index: 24;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
  height: 56px; min-width: 56px; padding: 0 18px; border-radius: 28px; border: 0;
  background: var(--accent); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700;
  box-shadow: 0 6px 18px var(--shadow-c);
}
.fab .lbl-txt { display: none; }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; }
  .rail {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px);
    height: 100vh; padding-block: 20px;
  }
  .rail .brand { font-family: var(--font-display); font-size: 22px; font-weight: 650; color: var(--accent); padding: 4px 12px 18px; }
  .rail .brand small { display: block; font-family: var(--font-body); font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .rail a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md);
    color: var(--ink-2); text-decoration: none; font-weight: 600;
  }
  .rail a:hover { background: var(--sunk); color: var(--ink); }
  .rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .rail .sep { height: 1px; background: var(--line); margin: 10px 12px; }
  .tabbar { display: none; }
  .main { padding-bottom: 96px; margin: 0; }
  .fab { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: max(24px, env(safe-area-inset-right, 0px)); }
  .fab .lbl-txt { display: inline; }
  .topbar h1 { font-size: 26px; }
}

/* ---------- bannières ---------- */
.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--sunk); color: var(--ink-2); font-size: 14px; margin-bottom: 14px;
}
.banner.warn { background: var(--sun-soft); color: var(--ink); }
.banner.err { background: var(--danger-soft); color: var(--ink); }
.banner a { color: var(--accent); font-weight: 600; }

/* ---------- cartes & listes ---------- */
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span2 { grid-column: 1 / -1; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 32px; }
.card-h h3 { font-size: 17px; flex: 1; min-width: 0; }
.count { font-size: 13px; font-weight: 700; color: var(--ink-3); background: var(--sunk); border-radius: 999px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.count.danger { background: var(--danger-soft); color: var(--danger); }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 4px; text-decoration: none; }
.empty { color: var(--ink-3); font-size: 15px; padding: 6px 0 4px; }
.card.late { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.card.reminders { background: var(--sun-soft); border-color: transparent; }

.list > li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 4px; min-height: 54px; }
.row-main {
  flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 8px 4px;
  display: flex; flex-direction: column; gap: 2px; border-radius: var(--r-sm);
}
.row-main:hover .row-title { color: var(--accent); }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row-meta .ic-sm { color: var(--ink-3); }
.is-done .row-title { text-decoration: line-through; color: var(--ink-3); }
.tick { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; flex: none; margin-left: -8px; }
.tick span {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink-3); display: grid; place-items: center; color: transparent;
}
.tick.urgent span { border-color: var(--danger); }
.tick:hover span { border-color: var(--accent); }
.is-done .tick span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tick .ic { width: 15px; height: 15px; stroke-width: 3; }
.ev-time {
  width: 58px; flex: none; font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.2; align-self: center;
}
.ev-time small { display: block; font-weight: 500; color: var(--ink-3); font-size: 12.5px; }
.swatch { width: 4px; align-self: stretch; border-radius: 4px; margin: 10px 8px 10px 0; background: var(--c, var(--ink-3)); flex: none; }
.swatch.dashed { background: repeating-linear-gradient(180deg, var(--c) 0 5px, transparent 5px 8px); }

.cat { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); display: inline-block; flex: none; }
.pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px;
  background: var(--sunk); color: var(--ink-2); white-space: nowrap; letter-spacing: .01em;
}
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.sun { background: var(--sun-soft); color: var(--sun); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.ex { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-3); font-weight: 600; }
.pill.tbc { background: transparent; border: 1px dashed var(--sun); color: var(--sun); }

.btn {
  min-height: 44px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface);
  font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.btn.danger.solid { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.quick-add { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quick-add .btn { padding: 0 8px; font-size: 15px; background: var(--surface); }
.quick-add .btn .ic { color: var(--accent); }
@media (max-width: 440px) { .quick-add .btn { flex-direction: column; gap: 2px; min-height: 62px; font-size: 14px; } }

/* segmented */
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 0 14px; min-height: 36px; border-radius: 999px; font-weight: 650; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow-c); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar .grow { flex: 1; }

/* ---------- accueil ---------- */
.hello { padding: 6px 0 14px; display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.date-big { font-size: 32px; line-height: 1.08; }
.date-big .num { color: var(--accent); font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .date-big { font-size: 40px; } }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { font-size: 13.5px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.flag.off { background: var(--off); color: var(--off-ink); border-color: transparent; }
.flag.hol { background: var(--sun-soft); color: var(--sun); border-color: transparent; }
.flag.vac { background: color-mix(in srgb, var(--c-vac) 14%, var(--surface)); color: var(--c-vac); border-color: transparent; }

.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.ws-day {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 8px 2px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 86px; min-width: 0;
}
.ws-day.is-off { background: repeating-linear-gradient(135deg, var(--off) 0 5px, var(--surface) 5px 10px); border-color: var(--line); }
.ws-day.is-today { border: 2px solid var(--sun); }
.ws-dow { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--ink-3); letter-spacing: .04em; }
.ws-num { font-family: var(--font-display); font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ws-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 8px; }
.ws-n { font-size: 11.5px; color: var(--ink-2); font-weight: 650; }
.ws-tag { font-size: 11px; font-weight: 700; color: var(--off-ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.ws-tag.hol { color: var(--sun); }
.week-sum { margin-top: 10px; font-size: 14px; color: var(--ink-2); }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 12px; }
.kpi { background: var(--sunk); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.kpi b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.kpi.hl { background: var(--accent-soft); }
.kpi.hl b { color: var(--accent); }
.kpi.bad { background: var(--danger-soft); }
.kpi.bad b { color: var(--danger); }

.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--sunk); }
.bar i { display: block; height: 100%; }
.bar .s-pris { background: var(--c-vac); }
.bar .s-confirme { background: color-mix(in srgb, var(--c-vac) 70%, var(--surface)); }
.bar .s-demande { background: color-mix(in srgb, var(--c-vac) 45%, var(--surface)); }
.bar .s-prevu { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c-vac) 40%, var(--surface)) 0 4px, transparent 4px 8px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.lg-off { background: repeating-linear-gradient(135deg, var(--off) 0 3px, var(--surface) 3px 6px); border: 1px solid var(--line); }
.lg-hol { background: var(--sun); }

.note-box { font-size: 14px; color: var(--ink-2); background: var(--sunk); border-radius: var(--r-md); padding: 10px 12px; }
.note-box.tbc { background: var(--sun-soft); color: var(--ink); }
/* décompte vacances : seule carte pleine couleur de l'accueil */
.countdown { background: var(--accent); color: var(--accent-ink); border-color: transparent; display: flex; flex-direction: column; gap: 12px; }
.cd-main { display: flex; align-items: center; gap: 16px; }
.cd-num { font-family: var(--font-display); font-weight: 650; font-size: 54px; line-height: 1; color: var(--accent-soft); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; flex: none; }
.cd-num small { font-size: 26px; margin-right: 1px; }
.cd-num.word { font-size: 34px; }
.cd-txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.cd-txt h3 { font-size: 19px; color: inherit; overflow-wrap: anywhere; }
.cd-txt p { font-size: 14.5px; }
.cd-txt b { color: var(--accent-soft); }
.cd-bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent-ink) 22%, transparent); overflow: hidden; }
.cd-bar i { display: block; height: 100%; background: var(--accent-soft); border-radius: 4px; }
.cd-foot { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.countdown .link-btn { color: var(--accent-soft); padding: 0; }
.note-box b { color: var(--ink); }

/* ---------- filtres ---------- */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: thin; }
.fsel { display: flex; flex-direction: column; gap: 2px; flex: none; }
.fsel span { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding-left: 4px; }
.fsel select { min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 30px 0 12px; font-weight: 600; font-size: 15px; }
.fsel select.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.search-inp { width: 100%; min-height: 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px 0 44px; font-size: 16px; }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap .ic { position: absolute; left: 14px; top: 12px; color: var(--ink-3); }
.group-h { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 4px; display: flex; gap: 8px; align-items: center; }
.group-h.late { color: var(--danger); }

/* ---------- agenda ---------- */
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-title { font-family: var(--font-display); font-size: 19px; font-weight: 650; flex: 1; min-width: 0; }
.cal-title small { display: block; font-family: var(--font-body); font-size: 13px; color: var(--ink-3); font-weight: 600; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.month .dh { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; padding: 4px 0; letter-spacing: .04em; }
.mc {
  position: relative; min-height: 58px; border: 1px solid transparent; border-radius: var(--r-sm); background: var(--surface);
  padding: 4px 4px 9px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; overflow: hidden;
}
.mc.out { opacity: .45; }
.mc.is-off { background: repeating-linear-gradient(135deg, var(--off) 0 4px, var(--surface) 4px 8px); }
.mc.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mc .n { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.mc.is-today .n { background: var(--sun); color: var(--surface); font-weight: 800; }
.mc.is-hol .n { color: var(--sun); box-shadow: inset 0 0 0 1.5px var(--sun); }
.mc.is-today.is-hol .n { color: var(--surface); }
.mc .dots { display: flex; gap: 3px; flex-wrap: wrap; padding-left: 2px; }
.mc .chipline { display: none; }
.mc .lv { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; display: flex; }
.mc .lv i { flex: 1; background: var(--c); }
.mc .lv i.tbc { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px); }
@media (min-width: 760px) {
  .mc { min-height: 104px; }
  .mc .dots { display: none; }
  .mc .chipline { display: block; font-size: 12px; line-height: 1.25; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); border-left: 3px solid var(--c, var(--ink-3)); padding-left: 4px; }
  .mc .chipline.hol { border-color: var(--sun); color: var(--sun); font-weight: 650; }
}
.day-block { margin-top: 16px; }
.day-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.day-h h3 { font-size: 18px; }
.week-day { border-top: 1px solid var(--line); padding: 10px 0; }
.week-day:first-child { border-top: 0; }
.week-day.is-off { background: linear-gradient(90deg, var(--off), transparent 70%); border-radius: var(--r-sm); padding-left: 10px; padding-right: 10px; }
.week-day .wd-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.wd-h .d { font-family: var(--font-display); font-weight: 650; font-size: 17px; border: 0; background: none; padding: 4px 0; }
.wd-h .d.today { color: var(--sun); }
.allday { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.allday .ad {
  display: flex; align-items: center; gap: 8px; border: 0; text-align: left; width: 100%;
  background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-left: 4px solid var(--c); border-radius: var(--r-sm);
  padding: 7px 10px; font-size: 14.5px; font-weight: 600; color: var(--ink);
}
.allday .ad.tbc { border-left-style: dashed; }
.allday .ad small { font-weight: 500; color: var(--ink-2); }

/* ---------- formulaires ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet {
  background: var(--surface); width: 100%; max-height: 94%; border-radius: var(--r-lg) var(--r-lg) 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px var(--shadow-c);
}
@media (min-width: 640px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { max-width: 580px; border-radius: var(--r-lg); max-height: 88vh; padding-bottom: 0; }
}
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 20px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-size: 20px; flex: 1; }
.sheet-b { overflow-y: auto; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.sheet-f { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: center; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sheet-f .sp { flex: 1; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-weight: 650; font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.hint { font-weight: 500; color: var(--ink-3); font-size: 13px; }
.inp {
  width: 100%; min-height: 46px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg);
  padding: 10px 12px; font-size: 16px;
}
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.bad { border-color: var(--danger); }
textarea.inp { resize: vertical; min-height: 84px; line-height: 1.45; }
select.inp { padding-right: 32px; }
.err { color: var(--danger); font-size: 13.5px; font-weight: 600; }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row2 > * { flex: 1 1 140px; min-width: 0; }
.datefield { display: flex; gap: 6px; }
.datefield .inp { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
.datefield .icon-btn { border: 1px solid var(--line); border-radius: var(--r-md); width: 46px; height: 46px; background: var(--surface); }
.inp-time { max-width: 120px; font-variant-numeric: tabular-nums; }
.qd { display: flex; gap: 6px; flex-wrap: wrap; }
.qd button { border: 0; background: var(--sunk); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); min-height: 34px; }
.qd button:hover { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); font-weight: 600; font-size: 15px; background: var(--surface);
}
.chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.segr { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--sunk); border-radius: var(--r-md); padding: 3px; gap: 3px; }
.segr.wrap4 { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 520px) { .segr.wrap4 { grid-auto-flow: column; grid-template-columns: none; } }
.segr label { position: relative; }
.segr input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.segr span { display: grid; place-items: center; min-height: 40px; border-radius: 9px; font-weight: 650; font-size: 14.5px; color: var(--ink-2); text-align: center; padding: 2px 6px; line-height: 1.15; }
.segr input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow-c); }
.segr input:focus-visible + span { outline: 2.5px solid var(--accent); }
.segr .v-urgente input:checked + span { color: var(--danger); }
details.more { border-top: 1px solid var(--line); padding-top: 8px; }
details.more > summary { cursor: pointer; font-weight: 650; color: var(--accent); min-height: 40px; display: flex; align-items: center; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); margin-right: 8px; font-weight: 700; }
details.more[open] > summary::before { content: "−"; }
details.more[open] { display: flex; flex-direction: column; gap: 16px; }
.privacy-note { display: flex; gap: 8px; font-size: 13.5px; background: var(--accent-soft); color: var(--ink); padding: 9px 12px; border-radius: var(--r-md); }
.privacy-note .ic { color: var(--accent); margin-top: 1px; }
.checkline { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; }
.checkline input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.radiolist { display: flex; flex-direction: column; gap: 2px; }
.radiolist label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; font-weight: 600; }
.radiolist input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 2px; flex: none; }
.radiolist small { display: block; font-weight: 500; color: var(--ink-3); }
.daychips { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.daychip {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 6px 2px; display: flex; flex-direction: column; align-items: center;
  font-size: 12.5px; line-height: 1.2; font-variant-numeric: tabular-nums; min-height: 60px; justify-content: center;
}
.daychip b { font-size: 15px; margin-top: 2px; }
.daychip.v1 { background: color-mix(in srgb, var(--c-vac) 16%, var(--surface)); border-color: var(--c-vac); }
.daychip.vh { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c-vac) 18%, var(--surface)) 0 5px, var(--surface) 5px 10px); border-color: var(--c-vac); }
.daychip.v0 { color: var(--ink-3); }
.daychip.v0 b { font-weight: 500; }
.daychip .tag { font-size: 10px; color: var(--off-ink); font-weight: 700; text-transform: uppercase; }
.daychip .tag.hol { color: var(--sun); }
.daycount { font-weight: 700; font-size: 15px; }

/* sélecteur de date */
.picker-wrap { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.picker { background: var(--surface); border-radius: var(--r-lg); padding: 12px; width: min(360px, 100%); box-shadow: 0 10px 40px var(--shadow-c); }
.picker .ph { display: flex; align-items: center; }
.picker .ph b { flex: 1; text-align: center; font-family: var(--font-display); font-size: 17px; }
.picker .pg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; margin-top: 6px; }
.picker .pg .dh { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3); padding: 4px 0; text-transform: uppercase; }
.picker .pd { height: 42px; border: 0; background: none; border-radius: 50%; font-weight: 600; font-variant-numeric: tabular-nums; }
.picker .pd:hover { background: var(--sunk); }
.picker .pd.off { color: var(--off-ink); }
.picker .pd.hol { color: var(--sun); }
.picker .pd.today { box-shadow: inset 0 0 0 2px var(--sun); }
.picker .pd.sel { background: var(--accent); color: var(--accent-ink); }
.picker .pf { display: flex; justify-content: space-between; margin-top: 8px; }

/* toast */
.toast {
  position: fixed; z-index: 70; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 84px);
  background: var(--ink); color: var(--bg); border-radius: var(--r-md); padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 32px); font-weight: 600; font-size: 15px; box-shadow: 0 8px 24px var(--shadow-c);
}
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 700; padding: 6px 8px; text-decoration: underline; }
@media (min-width: 900px) { .toast { bottom: 100px; } }

/* projets & notes */
.proj-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; }
.proj-card:hover h3 { color: var(--accent); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.qa-form { display: flex; gap: 8px; margin-top: 8px; }

        <p style="font-size:15px">Vos données restent sur ce téléphone. Pour reprendre celles de la version claude.ai : ouvrez-la, Réglages → « Sauvegarde complète (.json) » → Enregistrer dans Fichiers, puis importez le fichier ici.</p>
        <div class="btn-row" style="margin-top:10px"><button class="btn primary" data-act="import">${icon('upload')}Importer une sauvegarde</button><button class="btn" data-act="new-task">Commencer sans</button></div>

        <button class="btn" data-act="new-event">${icon('cal')}Rendez-vous</button>
        <button class="btn" data-act="new-note">${icon('note')}Note</button>
      </div>
      <div class="toolbar" style="margin:0">${sphereToggle()}<span class="grow"></span></div>
      ${rem.length ? `<section class="card reminders" aria-labelledby="h-rem">
        <div class="card-h">${icon('bell')}<h3 id="h-rem">Rappels</h3><span class="count">${rem.length}</span></div>
        <ul class="list">${rem.map(r => `<li class="row"><button class="row-main" data-act="edit" data-id="${esc(r.item.id)}"><span class="row-title">${esc(r.item.title)}</span><span class="row-meta">${esc(r.label)}</span></button><button class="btn ghost" data-act="seen" data-id="${esc(r.item.id)}">Vu</button></li>`).join('')}</ul>
        <p class="hint" style="margin-top:6px">Rappels affichés ici uniquement, sans notification sur le téléphone. <a href="#aide" class="link-btn" style="padding:0">Pourquoi ?</a></p>

      <div class="grid2">
        <section class="card" aria-labelledby="h-today">
          <div class="card-h"><h3 id="h-today">Aujourd’hui</h3><span class="count">${evToday.length + todayT.length}</span></div>

            `<ul class="list">${evToday.map(e => eventRow(e, { iso: t })).join('')}${todayT.map(x => taskRow(x, { showDate: false })).join('')}</ul>`)}

        </section>
        <section class="card" aria-labelledby="h-soon">

          <div class="card-h"><h3 id="h-week">Votre semaine</h3><span class="muted tnum" style="font-size:13px">${DOW_S[dow(t)]} ${fmtDM(t)} → ${DOW_S[dow(days[6])]} ${fmtDM(days[6])}</span></div>

VIEWS.taches = {
  title: () => 'Tâches',
  html() {
    const f = ui.tf; const t = todayISO();
    let list = tasks();
    if (f.status === 'actives') list = list.filter(x => x.status !== 'terminee');
    else if (f.status !== 'toutes') list = list.filter(x => x.status === f.status);
    if (f.cat !== 'all') list = list.filter(x => x.category === f.cat);
    if (f.prio !== 'all') list = list.filter(x => x.priority === f.prio);
    if (f.when === 'late') list = list.filter(x => x.due && x.due < t && x.status !== 'terminee');
    else if (f.when === 'today') list = list.filter(x => x.due === t);
    else if (f.when === 'week') list = list.filter(x => x.due && x.due >= t && x.due <= addDays(t, 7));
    else if (f.when === 'month') list = list.filter(x => x.due && x.due.slice(0, 7) === t.slice(0, 7));
    else if (f.when === 'nodate') list = list.filter(x => !x.due);
    if (f.q) { const q = norm(f.q); list = list.filter(x => norm(x.title + ' ' + (x.notes || '')).includes(q)); }
    const groups = [
      ['late', 'En retard', x => x.status !== 'terminee' && x.due && x.due < t],
      ['today', 'Aujourd’hui', x => x.status !== 'terminee' && x.due === t],
      ['week', '7 prochains jours', x => x.status !== 'terminee' && x.due > t && x.due <= addDays(t, 7)],
      ['later', 'Plus tard', x => x.status !== 'terminee' && x.due > addDays(t, 7)],
      ['nodate', 'Sans échéance', x => x.status !== 'terminee' && !x.due],
      ['done', 'Terminées', x => x.status === 'terminee'],
    ];
    const sel = (id, key, label, opts) => `<label class="fsel"><span>${label}</span><select id="${id}" data-filter="${key}" class="${f[key] !== opts[0][0] ? 'on' : ''}">${opts.map(([k, l]) => `<option value="${k}" ${f[key] === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
    const dirty = f.status !== 'actives' || f.cat !== 'all' || f.prio !== 'all' || f.when !== 'all' || f.q;
    const body = groups.map(([k, label, fn]) => {
      const g = list.filter(fn).sort(k === 'done' ? (a, b) => (b.completedAt || '').localeCompare(a.completedAt || '') : byTask);
      if (!g.length) return '';
      return `<h3 class="group-h ${k === 'late' ? 'late' : ''}">${label} <span class="count ${k === 'late' ? 'danger' : ''}">${g.length}</span></h3><ul class="list card" style="padding:4px 12px">${g.map(x => taskRow(x)).join('')}</ul>`;
    }).join('');
    return `
      <div class="toolbar">${sphereToggle()}<span class="grow"></span><button class="btn primary" data-act="new-task">${icon('plus')}Tâche</button></div>
      <div class="search-wrap">${icon('search')}<input id="tf-q" class="search-inp" type="search" placeholder="Rechercher dans les tâches" value="${esc(f.q)}" data-filter="q" autocomplete="off"></div>
      <div class="filters" role="group" aria-label="Filtres">
        ${sel('tf-status', 'status', 'Statut', [['actives', 'À faire + en cours'], ['a_faire', 'À faire'], ['en_cours', 'En cours'], ['terminee', 'Terminées'], ['toutes', 'Toutes']])}
        ${sel('tf-when', 'when', 'Date', [['all', 'Toutes dates'], ['late', 'En retard'], ['today', 'Aujourd’hui'], ['week', '7 jours'], ['month', 'Ce mois'], ['nodate', 'Sans date']])}
        ${sel('tf-prio', 'prio', 'Priorité', [['all', 'Toutes'], ['urgente', 'Urgente'], ['normale', 'Normale'], ['basse', 'Basse']])}
        ${sel('tf-cat', 'cat', 'Catégorie', [['all', 'Toutes'], ...CATS.map(c => [c.k, c.l])])}
      </div>
      ${dirty ? `<button class="link-btn" data-act="reset-filters">Effacer les filtres</button>` : ''}
      ${body || `<div class="card">${emptyLine(!S.loaded ? 'Chargement…' : dirty ? 'Aucune tâche ne correspond à ces filtres.' : 'Aucune tâche. Ajoutez-en une avec le bouton « Tâche ».')}</div>`}`;
  },
};

function dayDetail(iso, { heading = true } = {}) {
  const hol = showHol(iso); const lv = leavesOn(iso); const off = isOff(iso);
  const evs = events().filter(e => evCovers(e, iso)).sort(byEv);
  const allDayEv = evs.filter(e => !e.time || e.date !== iso);
  const timed = evs.filter(e => e.time && e.date === iso);
  const tk = tasks().filter(x => x.due === iso).sort(byTask);
  const pd = projectDatesOn(iso);
  const allday = [
    ...lv.map(l => `<button class="ad ${l.status === 'prevu' ? 'tbc' : ''}" style="--c:var(${(LTYPE[l.type] || LTYPE.autre).v})" data-act="edit" data-id="${esc(l.id)}">${esc(l.title)} <small>${(LSTATUS[l.status] || LSTATUS.prevu).l}</small></button>`),
    ...pd.map(({ p, d }) => `<a class="ad" style="--c:var(${(CAT[p.category] || CAT.autre).v});text-decoration:none" href="#projet-${encodeURIComponent(p.id)}">${icon('flag', 'ic-sm')} ${esc(d.label)} <small>${esc(p.title)}</small></a>`),
  ].join('');
  const n = evs.length + tk.length;
  return `<div class="day-block">
    ${heading ? `<div class="day-h"><h3>${longDate(iso)}</h3>${off ? '<span class="flag off">Congé habituel</span>' : ''}${hol ? `<span class="flag hol">Férié : ${esc(hol)}</span>` : ''}</div>` : ''}
    ${allday ? `<div class="allday">${allday}</div>` : ''}
    ${n ? `<ul class="list">${[...allDayEv, ...timed].map(e => eventRow(e, { iso })).join('')}${tk.map(x => taskRow(x, { showDate: false })).join('')}</ul>` : (allday ? '' : emptyLine('Rien de prévu ce jour-là.'))}
    <div class="btn-row" style="margin-top:8px"><button class="btn ghost" data-act="new-event" data-date="${iso}">${icon('plus')}Rendez-vous</button><button class="btn ghost" data-act="new-task" data-date="${iso}">${icon('plus')}Tâche</button></div>
  </div>`;
}

        <div class="note-box tbc" style="margin-bottom:8px">Ces dates sont des <b>prévisions</b> : elles ne sont pas encore demandées ni approuvées par l’employeur. Changez le statut au fur et à mesure (Demandé, puis Confirmé).</div>

          ${ot.plannedRecup ? `<p class="hint">Après les récupérations prévues : ${num(ot.projected)} h.</p>` : ''}

          <div class="btn-row" style="margin-top:8px"><button class="btn" data-act="new-ot" data-sign="1">${icon('plus')}Ajouter des heures</button><button class="btn" data-act="new-ot" data-sign="-1">Récupérer</button></div>

        <section class="card" aria-labelledby="h-form">

          ${S.settings.vacation.formationComp !== false ? `<p class="hint" style="margin-top:6px">Une formation sur un jour de congé habituel est récupérée en jour de vacances${vs.comp ? ` : +${num(vs.comp)} j en ${y}` : ''}.</p>` : ''}
          <h3 class="group-h">Fériés officiels · Vaud</h3>
          <ul class="date-list">${hols.map(([d, n]) => `<li><span class="dd">${DOW_S[dow(d)]} ${fmtDM(d)}</span><span class="dl">${esc(n)}</span>${isOff(d) ? '<span class="pill">jour de congé</span>' : ''}</li>`).join('')}
          ${extraHol.map(l => `<li><span class="dd">${DOW_S[dow(l.start)]} ${fmtDM(l.start)}</span><button class="dl link-btn" style="text-align:left;padding:0" data-act="edit" data-id="${esc(l.id)}">${esc(l.title)}</button><span class="pill">employeur</span></li>`).join('')}</ul>
          <p class="hint" style="margin-top:6px">Calculés automatiquement. ${S.settings.employerBreak.on ? `Vos congés offerts entre Noël et Nouvel An (${S.settings.employerBreak.from.split('-').reverse().join('.')} → ${S.settings.employerBreak.to.split('-').reverse().join('.')}) sont ajoutés chaque année et ne sont pas décomptés des vacances.` : 'Pour un autre jour offert par l’employeur, ajoutez une période « Férié / congé offert ».'} <button class="link-btn" style="padding:0" data-act="break-settings">Modifier</button></p>
        </section>
      </div>

      <section class="card" aria-labelledby="h-emp">
        <div class="card-h"><h3 id="h-emp">Démarches auprès de l’employeur</h3>${emp ? `<a class="link-btn" href="#projet-${encodeURIComponent(emp.id)}">Ouvrir</a>` : ''}</div>
        ${emp ? `${empTasks.length ? `<ul class="list">${empTasks.map(x => taskRow(x)).join('')}</ul>` : emptyLine('Aucune démarche.')}
          <form class="qa-form" data-form="quick-task" data-proj="${esc(emp.id)}"><input id="qa-emp" class="inp" placeholder="Ajouter une démarche…" autocomplete="off" maxlength="140"><button class="btn primary" type="submit">Ajouter</button></form>
          ${emp.notes ? `<div class="note-box" style="margin-top:10px;white-space:pre-line">${esc(emp.notes)}</div>` : ''}`
        : `<p class="empty">Gardez ici la liste de ce qu’il faut demander ou clarifier (dates, ponts, report d’heures…).</p><button class="btn" data-act="create-emp">${icon('plus')}Créer la liste des démarches</button>`}
      </section>
    </div>`;
  },
};

VIEWS.projets = {

      const ps = all('project').sort((a, b) => (a.role === 'employeur') - (b.role === 'employeur') || a.title.localeCompare(b.title, 'fr'));
      body = ps.length ? `<div class="grid2">${ps.map(p => {
        const tk = all('task').filter(x => x.projectId === p.id); const done = tk.filter(x => x.status === 'terminee').length;
        const nextD = (p.dates || []).filter(d => d.date >= todayISO()).sort((a, b) => a.date.localeCompare(b.date))[0];
        return `<a class="card proj-card" href="#projet-${encodeURIComponent(p.id)}">
          <div class="card-h" style="margin:0"><span class="dot" style="--c:var(${(CAT[p.category] || CAT.autre).v});width:12px;height:12px"></span><h3>${esc(p.title)}</h3>${exPill(p)}${p.forecast ? '<span class="pill tbc">À confirmer</span>' : ''}</div>
          ${p.description ? `<p style="color:var(--ink-2);font-size:14.5px">${esc(p.description)}</p>` : ''}
          <div class="progress"><i style="width:${tk.length ? done / tk.length * 100 : 0}%"></i></div>
          <span class="row-meta"><span>${done}/${tk.length} tâches</span>${nextD ? `<span>${icon('flag', 'ic-sm')} ${fmtCH(nextD.date)} · ${esc(nextD.label)}</span>` : ''}</span>
        </a>`;
      }).join('')}</div>` : `<div class="card">${emptyLine(S.loaded ? 'Aucun projet. Créez une liste pour l’appartement, les démarches ou un voyage.' : 'Chargement…')}</div>`;
      body = `<div class="toolbar"><span class="grow"></span><button class="btn primary" data-act="new-project">${icon('plus')}Projet</button></div>` + body;
    } else {
      let ns = all('note').sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      if (ui.notesQ) { const q = norm(ui.notesQ); ns = ns.filter(n => norm(n.title + ' ' + n.body).includes(q)); }
      body = `<div class="toolbar"><span class="grow"></span><button class="btn primary" data-act="new-note">${icon('plus')}Note</button></div>
        <div class="search-wrap">${icon('search')}<input id="notes-q" class="search-inp" type="search" placeholder="Rechercher dans les notes" value="${esc(ui.notesQ)}" data-filter="notesQ" autocomplete="off"></div>
        ${ns.length ? `<div class="grid2">${ns.map(n => noteCard(n)).join('')}</div>` : `<div class="card">${emptyLine(ui.notesQ ? 'Aucune note ne correspond.' : 'Aucune note pour l’instant.')}</div>`}`;
    }
    return `<div class="toolbar"><div class="seg" role="group" aria-label="Section"><button data-act="proj-tab" data-v="projets" aria-pressed="${tab === 'projets'}">Projets</button><button data-act="proj-tab" data-v="notes" aria-pressed="${tab === 'notes'}">Notes</button></div></div>${body}`;
  },
};
function noteCard(n) {
  const p = n.projectId && S.items.get(n.projectId);
  return `<button class="note-card" data-act="edit" data-id="${esc(n.id)}"><h3>${esc(n.title || 'Sans titre')}</h3>${n.body ? `<p>${esc(n.body)}</p>` : ''}<span class="row-meta">${n.category ? catChip(n.category) : ''}${p ? `<span>${esc(p.title)}</span>` : ''}${n.updatedAt ? `<span class="muted">${fmtCH(n.updatedAt.slice(0, 10))}</span>` : ''}${exPill(n)}</span></button>`;
}

VIEWS.recherche = {
  title: () => 'Recherche',
  html() {
    const q = norm(ui.q.trim());
    let res = '';
    if (q.length >= 2) {
      const match = (...f) => norm(f.join(' ')).includes(q);
      const tk = all('task').filter(x => match(x.title, x.notes)).sort(byTask);
      const ev = all('event').filter(x => match(x.title, x.notes, x.location)).sort(byEv);
      const nt = all('note').filter(x => match(x.title, x.body));
      const pj = all('project').filter(x => match(x.title, x.description, x.notes, ...(x.dates || []).map(d => d.label)));
      const lv = all('leave').filter(x => match(x.title, x.notes)).sort((a, b) => a.start.localeCompare(b.start));
      const total = tk.length + ev.length + nt.length + pj.length + lv.length;
      res = total ? [
        tk.length ? `<h3 class="group-h">Tâches <span class="count">${tk.length}</span></h3><ul class="list card" style="padding:4px 12px">${tk.map(x => taskRow(x)).join('')}</ul>` : '',
        ev.length ? `<h3 class="group-h">Rendez-vous <span class="count">${ev.length}</span></h3><ul class="list card" style="padding:4px 12px">${ev.map(x => eventRow(x, { showDate: true })).join('')}</ul>` : '',
        nt.length ? `<h3 class="group-h">Notes <span class="count">${nt.length}</span></h3><div class="grid2">${nt.map(noteCard).join('')}</div>` : '',
        pj.length ? `<h3 class="group-h">Projets <span class="count">${pj.length}</span></h3><ul class="list card" style="padding:4px 12px">${pj.map(p => `<li class="row"><a class="row-main" style="text-decoration:none;color:inherit" href="#projet-${encodeURIComponent(p.id)}"><span class="row-title">${esc(p.title)}</span><span class="row-meta">${esc(p.description || '')}</span></a></li>`).join('')}</ul>` : '',
        lv.length ? `<h3 class="group-h">Congés <span class="count">${lv.length}</span></h3><ul class="list card" style="padding:4px 12px">${lv.map(l => leaveRow(l)).join('')}</ul>` : '',
      ].join('') : `<div class="card">${emptyLine('Aucun résultat pour « ' + esc(ui.q.trim()) + ' ».')}</div>`;
    } else res = `<p class="empty">Tapez au moins 2 lettres. La recherche porte sur les tâches, rendez-vous, notes, projets et congés.</p>`;
    return `<div class="search-wrap">${icon('search')}<input id="global-q" class="search-inp" type="search" placeholder="Rechercher…" value="${esc(ui.q)}" data-filter="q-global" autocomplete="off"></div>${res}`;
  },
  after() { const el = $('#global-q'); if (el && document.activeElement !== el && !matchMedia('(hover: none)').matches) el.focus({ preventScroll: true }); },
};

VIEWS.reglages = {

/* ---------- champs de formulaire ---------- */
function fld(label, inner, { forId = '', hint = '', err = '' } = {}) {
  return `<div class="fld"><label class="lbl" ${forId ? `for="${forId}"` : ''}>${label}${hint ? `<span class="hint">${hint}</span>` : ''}</label>${inner}${err ? `<p class="err" id="err-${err}" hidden></p>` : ''}</div>`;
}
function dateField(id, iso, { quick = true, clear = false } = {}) {
  return `<div class="stack" style="gap:6px"><div class="datefield"><input id="${esc(id)}" class="inp" type="text" inputmode="decimal" placeholder="jj.mm.aaaa" value="${fmtCH(iso)}" autocomplete="off" data-date-input>
    <button type="button" class="icon-btn" data-act="pick-date" data-for="${esc(id)}" aria-label="Choisir dans le calendrier">${icon('cal')}</button></div>
    ${quick ? `<div class="qd"><button type="button" data-act="set-date" data-for="${esc(id)}" data-v="0">Aujourd’hui</button><button type="button" data-act="set-date" data-for="${esc(id)}" data-v="1">Demain</button><button type="button" data-act="set-date" data-for="${esc(id)}" data-v="7">Dans 1 semaine</button>${clear ? `<button type="button" data-act="set-date" data-for="${esc(id)}" data-v="">Effacer</button>` : ''}</div>` : ''}</div>`;
}
function chipRadio(name, opts, value) {

}
function segRadio(name, opts, value, cls = '') {
  return `<div class="segr ${cls}" role="radiogroup">${opts.map(o => `<label class="v-${o.k}"><input type="radio" id="${name}-${o.k}" name="${name}" value="${o.k}" ${o.k === value ? 'checked' : ''}><span>${o.l}</span></label>`).join('')}</div>`;
}
function projectSelect(id, value) {
  const ps = all('project').sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  return `<select id="${id}" class="inp"><option value="">Aucun</option>${ps.map(p => `<option value="${esc(p.id)}" ${p.id === value ? 'selected' : ''}>${esc(p.title)}</option>`).join('')}</select>`;
}
const val = id => (document.getElementById(id) || {}).value ?? '';
const radio = name => (document.querySelector(`input[name="${name}"]:checked`) || {}).value;
function fail(errId, msg, focusId) {
  const e = document.getElementById('err-' + errId); if (e) { e.textContent = msg; e.hidden = false; }
  const f = document.getElementById(focusId || errId); if (f) { f.classList.add('bad'); f.focus(); }
  return false;
}
function clearErrs() { $$('#sheetRoot .err').forEach(e => { e.hidden = true; }); $$('#sheetRoot .bad').forEach(e => e.classList.remove('bad')); }
function readDate(id, errId, { required = false } = {}) {
  const raw = val(id); const iso = parseCH(raw);
  if (iso === null) { fail(errId, 'Date non reconnue. Écrivez-la au format jj.mm.aaaa, par exemple 05.02.2027.', id); return undefined; }
  if (required && !iso) { fail(errId, 'Indiquez une date.', id); return undefined; }
  return iso;
}

/* ---------- feuille (formulaire) ---------- */

  </div></div>`;
  document.body.style.overflow = 'hidden';

function closeSheet() {

/* ---------- sélecteur de date ---------- */
let picker = null;
function openPicker(forId) {
  const inp = document.getElementById(forId); if (!inp) return;
  const cur = parseCH(inp.value) || todayISO();
  picker = { forId, month: cur.slice(0, 7) + '-01', sel: parseCH(inp.value) || '' };
  renderPicker();
}
function renderPicker() {
  if (!picker) { $('#pickerRoot').innerHTML = ''; return; }
  const m = picker.month; const d = fromISO(m); const t = todayISO();
  const last = toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  let cur = startOfWeek(m); const end = addDays(startOfWeek(last), 6); let cells = WEEK_ORDER.map(i => `<div class="dh">${DOW_S[i]}</div>`).join('');
  while (cur <= end) {
    const out = cur.slice(0, 7) !== m.slice(0, 7);
    cells += out ? '<span></span>' : `<button type="button" class="pd ${isOff(cur) ? 'off' : ''} ${holidayName(cur) ? 'hol' : ''} ${cur === t ? 'today' : ''} ${cur === picker.sel ? 'sel' : ''}" data-act="picker-day" data-date="${cur}" aria-label="${longDate(cur)}">${+cur.slice(8)}</button>`;
    cur = addDays(cur, 1);

  $('#pickerRoot').innerHTML = `<div class="picker-wrap" data-act="picker-close-bg"><div class="picker" role="dialog" aria-label="Choisir une date">
    <div class="ph"><button type="button" class="icon-btn" data-act="picker-move" data-d="-1" aria-label="Mois précédent">${icon('left')}</button><b>${cap1(MONTHS[d.getMonth()])} ${d.getFullYear()}</b><button type="button" class="icon-btn" data-act="picker-move" data-d="1" aria-label="Mois suivant">${icon('right')}</button></div>
    <div class="pg">${cells}</div>
    <div class="pf"><button type="button" class="btn ghost" data-act="picker-day" data-date="${t}">Aujourd’hui</button><button type="button" class="btn" data-act="picker-close">Fermer</button></div>
  </div></div>`;
}
function closePicker() { picker = null; $('#pickerRoot').innerHTML = ''; }
function setDateInput(id, iso) {
  const inp = document.getElementById(id); if (!inp) return;
  inp.value = fmtCH(iso); inp.classList.remove('bad');
  inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
}

let dlCap; async function getDownloads() {

const LS_BACKUP = 'carnet-leman-lastbackup';

async function offerFile(filename, content, mime, { onSaved } = {}) {
  if (!window.claude) {
    // Application installée (iPhone) : menu Partager → Enregistrer dans Fichiers, Mail, AirDrop…
    let file = null; try { file = new File([content], filename, { type: mime }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      let ok = false; try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
      if (ok) {
        try { await navigator.share({ files: [file] }); if (onSaved) onSaved(); toast('Fichier prêt'); return 'ok'; }
        catch (e) { if (e && e.name === 'AbortError') { toast('Partage annulé'); return 'declined'; } }
      }
    }
    try {
      const url = URL.createObjectURL(new Blob([content], { type: mime }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); if (onSaved) onSaved(); toast('Fichier téléchargé'); return 'ok';
    } catch (e) { showTextPanel(filename, content); return 'text'; }
  }
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data: content }); if (onSaved) onSaved(); toast('Fichier enregistré'); return 'ok'; }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') { toast('Enregistrement annulé'); return 'declined'; }
      if (code === 'rate_limited') { toast('Une demande d’enregistrement est déjà ouverte.'); return 'busy'; }
      if (code === 'rejected_extension' || code === 'extension_not_enabled') return 'rejected';
    }

  showTextPanel(filename, content);
  return 'text';
}

function icsFold(line) {

function buildICS(o) {
  const t = todayISO(); const dts = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Planning//Organisation//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Planning', 'X-WR-TIMEZONE:Europe/Zurich',

    'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD', 'END:VTIMEZONE'];

      L.push('BEGIN:VEVENT', `UID:${e.id}@carnet-leman`, `DTSTAMP:${dts}`, `DTSTART;TZID=Europe/Zurich:${icsDate(e.date)}T${e.time.replace(':', '')}00`, `DTEND;TZID=Europe/Zurich:${dtend}`, `SUMMARY:${icsEsc(e.title)}`);
      if (e.location) L.push(`LOCATION:${icsEsc(e.location)}`);

  if (o.tasks) for (const x of all('task')) if (x.due && x.status !== 'terminee' && keep(x.due)) allDay(x.id, x.due, x.due, `Échéance : ${x.title}`, x.notes || '', (CAT[x.category] || CAT.autre).l);

}

function startImport() { if (!canWrite()) return; const f = $('#importFile'); f.value = ''; f.click(); }
function handleImportFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(String(r.result).replace(/^\ufeff/, '')); } catch (e) { toast('Fichier illisible : choisissez une sauvegarde .json du Planning.'); return; }
    if (!o || o.format !== 'carnet-leman' || !Array.isArray(o.items)) { toast('Ce fichier n’est pas une sauvegarde du Planning.'); return; }
    const KINDS = ['task', 'event', 'note', 'leave', 'overtime', 'plan', 'project'];
    const idOk = s => typeof s === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(s) && s !== 'settings';
    const items = o.items.filter(it => it && typeof it === 'object' && KINDS.includes(it.kind)).map(it => { const c = clone(it); if (!idOk(c.id)) c.id = newId(c.kind[0]); return c; });
    const cnt = k => items.filter(i => i.kind === k).length;
    openSheet({
      title: 'Importer la sauvegarde',
      body: `<p>Sauvegarde ${o.exportedAt ? 'du ' + fmtCH(String(o.exportedAt).slice(0, 10)) : ''} : ${cnt('task')} tâches, ${cnt('event')} rendez-vous, ${cnt('leave')} congés, ${cnt('project')} projets, ${cnt('note')} notes.</p>
        <div class="radiolist">
          <label><input type="radio" name="imp-mode" id="imp-merge" value="merge" checked><span>Fusionner<small>Ajoute les éléments et met à jour ceux qui existent déjà. Rien n’est supprimé.</small></span></label>
          <label><input type="radio" name="imp-mode" id="imp-replace" value="replace"><span>Tout remplacer<small>Efface les données actuelles et les remplace par la sauvegarde.</small></span></label>
        </div>
        <label class="checkline"><input type="checkbox" id="imp-settings" checked>Importer aussi les réglages</label>`,
      saveLabel: 'Importer',
      onSave() {
        const mode = radio('imp-mode');
        if (mode === 'replace') for (const id of [...S.items.keys()]) if (!items.some(i => i.id === id)) removeItem(id);
        for (const it of items) putItem(it, { silent: true });
        if ($('#imp-settings').checked && o.settings) putSettings(o.settings);
        scheduleRender(); toast(`${items.length} éléments importés`);
      },
    });
  };
  r.readAsText(file);
}

    const ex = [...S.items.values()].filter(i => i.example);
    confirmSheet({ title: 'Supprimer les exemples ?', text: `${ex.length} éléments fictifs marqués « Exemple » seront supprimés. Vos propres données et les prévisions 2027 sont conservées.`, ok: 'Supprimer les exemples',
      onOk: () => deleteWithUndo(ex.map(i => i.id), 'Exemples supprimés') });
  },
  'del-all': () => {
    confirmSheet({ title: 'Tout effacer ?', text: 'Toutes vos tâches, rendez-vous, congés, projets et notes seront supprimés. Pensez à exporter une sauvegarde avant. Cette action ne peut pas être annulée.', ok: 'Tout effacer',
      onOk: () => { for (const id of [...S.items.keys()]) removeItem(id); toast('Toutes les données ont été effacées'); } });
  },
  undo: () => { const u = toast.undo; $('#toastRoot').innerHTML = ''; toast.undo = null; if (u) { u(); toast('Action annulée'); } },
  'close-sheet': () => closeSheet(),
  'sheet-save': () => saveSheet(),
  'sheet-delete': () => { const d = sheet && sheet.onDelete; closeSheet(); if (d) d(); },
  'pick-date': el => openPicker(el.dataset.for),
  'set-date': el => { const v = el.dataset.v; setDateInput(el.dataset.for, v === '' ? '' : addDays(todayISO(), +v)); },
  'picker-day': el => { const id = picker && picker.forId; closePicker(); if (id) setDateInput(id, el.dataset.date); },
  'picker-move': el => { picker.month = addMonths(picker.month, +el.dataset.d); renderPicker(); },
  'picker-close': () => closePicker(),
  'cycle-day': el => {
    const iso = el.dataset.date; const ty = radio('f-ltype') || 'vacances'; const cur = (iso in leaveDraft.dayValues) ? leaveDraft.dayValues[iso] : defFor(ty, iso);
    const nx = cur === 1 ? 0.5 : cur === 0.5 ? 0 : 1;
    if (nx === defFor(ty, iso)) delete leaveDraft.dayValues[iso]; else leaveDraft.dayValues[iso] = nx;
    renderLeaveDays();
    const b = document.querySelector(`.daychip[data-date="${iso}"]`); if (b) b.focus({ preventScroll: true });
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'sheet-backdrop') { if (e.target === el) closeSheet(); return; }
  if (act === 'picker-close-bg') { if (e.target === el) closePicker(); return; }
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter === 'q') { ui.tf.q = el.value; render(); }
  else if (el.dataset.filter === 'q-global') { ui.q = el.value; render(); }
  else if (el.dataset.filter === 'notesQ') { ui.notesQ = el.value; render(); }
  if (sheet && sheet.onChange && $('#sheetRoot').contains(el)) sheet.onChange(e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter && ['status', 'cat', 'prio', 'when'].includes(el.dataset.filter)) { ui.tf[el.dataset.filter] = el.value; saveUI(); render(); return; }
  if (el.dataset.actChange === 'toggle-hol') { if (!canWrite()) { el.checked = !el.checked; return; } const s = clone(S.settings); s.showHolidays = el.checked; putSettings(s); return; }
  if (el.name === 'f-cat') { const n = $('#f-privacy'); if (n) n.hidden = el.value !== 'travail'; }
  if (el.id === 'f-rep') { const c = $('#f-rep-custom'); if (c) c.hidden = el.value !== 'custom'; }
  if (el.id === 'importFile') { handleImportFile(el.files && el.files[0]); return; }
  if (el.dataset.autosave === 'project-notes') {
    const p = S.items.get(el.dataset.id); if (!p || p.notes === el.value) return;
    if (p.category === 'travail') { const hit = sensitiveHit(el.value); if (hit) { toast('Notes non enregistrées : ' + hit + ' détecté. Utilisez des références neutres.'); return; } }
    const u = clone(p); u.notes = el.value; putItem(u, { silent: true }); toast('Notes enregistrées');
  }
  if (sheet && sheet.onChange && $('#sheetRoot').contains(el)) sheet.onChange(e);
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.matches && el.matches('[data-date-input]')) { const iso = parseCH(el.value); if (iso) el.value = fmtCH(iso); else if (iso === null) el.classList.add('bad'); if (iso !== null) el.classList.remove('bad'); }
  if (el.matches && el.matches('[data-time-input]')) { const t = parseTime(el.value); if (t) el.value = t; el.classList.toggle('bad', t === null); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'sheet-form') { saveSheet(); return; }
  if (!canWrite()) return;
  if (f.dataset.form === 'quick-task') {
    const inp = f.querySelector('input'); const title = inp.value.trim(); if (!title) return;
    const p = S.items.get(f.dataset.proj); const category = p ? (p.category || 'autre') : 'autre';
    if (category === 'travail') { const hit = sensitiveHit(title); if (hit) { toast(PRIVACY_MSG(hit)); return; } }
    putItem({ id: newId('t'), kind: 'task', title, category, due: '', priority: 'normale', status: 'a_faire', notes: '', reminder: '', repeat: { freq: 'none' }, projectId: f.dataset.proj });
    inp.value = ''; toast('Tâche ajoutée');
  } else if (f.dataset.form === 'add-pdate') {
    const p = S.items.get(f.dataset.proj); if (!p) return;
    const dInp = document.getElementById('pd-date-' + p.id); const lInp = document.getElementById('pd-label-' + p.id);
    const iso = parseCH(dInp.value); const label = lInp.value.trim();
    if (!iso) { dInp.classList.add('bad'); dInp.focus(); toast('Indiquez une date au format jj.mm.aaaa.'); return; }
    if (!label) { lInp.focus(); toast('Indiquez un libellé pour cette date.'); return; }
    if (p.category === 'travail') { const hit = sensitiveHit(label); if (hit) { toast(PRIVACY_MSG(hit)); return; } }
    const u = clone(p); u.dates = [...(u.dates || []), { id: newId('d'), date: iso, label }]; putItem(u); toast('Date ajoutée');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (picker) closePicker(); else if (sheet) closeSheet(); }
});
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo({ top: 0 }); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleRender(); });
setInterval(() => { const r = currentRoute().name; if (!sheet && (r === 'accueil' || r === 'agenda')) scheduleRender(); }, 60000);

$('#btnSearch').innerHTML = icon('search');
$('#btnSettings').innerHTML = icon('sliders');
$('#fab').innerHTML = `${icon('plus')}<span class="lbl-txt">Ajouter</span>`;
init();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
